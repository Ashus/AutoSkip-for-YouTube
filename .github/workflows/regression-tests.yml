name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
