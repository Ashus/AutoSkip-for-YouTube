name: Selector health check

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  selectors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run selector health tests
        run: xvfb-run -a npm run test:live
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selector-health-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
